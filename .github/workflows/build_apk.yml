name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Harness
        run: |
          # Recreate standard Android platform files while preserving custom code & manifest
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          flutter create --platforms=android --org com.security .
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          # Ensure minSdk is 21 for camera & sensors
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyCameraDetector-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
